<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<title>עץ השרשורים — אב־טיפוס</title>
<style>
  :root { --bg:#07080f; --panel:rgba(18,20,34,.92); --line:rgba(255,255,255,.08); --text:#e8eaf6; --dim:#8b90ad; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Rubik,Arial,sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  .top { position:fixed; top:0; inset-inline:0; padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;
    display:flex; gap:8px; align-items:center; background:linear-gradient(var(--bg),transparent); pointer-events:none; }
  .top > * { pointer-events:auto; }
  .crumbs { flex:1; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; white-space:nowrap; font-size:13px; }
  .crumbs::-webkit-scrollbar { display:none; }
  .crumb { padding:5px 9px; border-radius:20px; background:rgba(255,255,255,.06); color:var(--dim); border:0; font:inherit; }
  .crumb.cur { color:var(--text); background:rgba(255,255,255,.14); }
  .sep { color:#444a66; align-self:center; }
  .btn { border:0; background:rgba(255,255,255,.1); color:var(--text); width:38px; height:38px; border-radius:50%;
    font-size:18px; display:grid; place-items:center; flex:none; }
  .btn:disabled { opacity:.3; }
  .hint { position:fixed; top:calc(env(safe-area-inset-top) + 58px); inset-inline:0; text-align:center; font-size:12px;
    color:var(--dim); pointer-events:none; transition:opacity 1s; }
  .sheet { position:fixed; inset-inline:0; bottom:0; background:var(--panel); backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); border-radius:18px 18px 0 0;
    padding:6px 16px calc(env(safe-area-inset-bottom) + 14px); max-height:40vh; overflow-y:auto;
    transition:transform .35s cubic-bezier(.2,.8,.2,1); }
  .sheet.min { transform:translateY(calc(100% - 92px)); }
  .grab { width:40px; height:5px; border-radius:3px; background:#3a3f5c; margin:4px auto 10px; }
  .head { display:flex; align-items:center; gap:10px; }
  .dot { width:12px; height:12px; border-radius:50%; flex:none; box-shadow:0 0 10px currentColor; }
  h1 { font-size:18px; margin:0; font-weight:650; line-height:1.3; flex:1; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 10px; font-size:12px; }
  .tag { padding:3px 8px; border-radius:12px; background:rgba(255,255,255,.07); color:var(--dim); }
  .tag b { font-weight:600; }
  .msgs { border-inline-start:2px solid var(--line); padding-inline-start:10px; margin:0 0 12px; }
  .msg { font-size:13.5px; line-height:1.45; margin:0 0 6px; }
  .msg i { color:var(--dim); font-style:normal; font-size:12px; margin-inline-end:4px; }
  .bar { height:6px; border-radius:3px; background:rgba(255,255,255,.07); overflow:hidden; margin:2px 0 4px; display:flex; }
  .bar span { display:block; height:100%; }
  .small { font-size:12px; color:var(--dim); margin-bottom:12px; }
  .kids-h { font-size:12px; color:var(--dim); margin:0 0 6px; }
  .kids { display:grid; gap:6px; }
  .kid { display:flex; align-items:center; gap:10px; width:100%; text-align:start; border:1px solid var(--line);
    background:rgba(255,255,255,.04); color:var(--text); padding:10px 12px; border-radius:12px; font:inherit; font-size:14px; }
  .kid .dot { width:9px; height:9px; }
  .kid .t { flex:1; }
  .kid .n { color:var(--dim); font-size:12px; }
  .kid .chev { color:var(--dim); }
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:11px; color:var(--dim); margin-top:14px; padding-top:10px; border-top:1px solid var(--line); }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .legend .dot { width:8px; height:8px; box-shadow:none; }
  .ring { width:10px; height:10px; border-radius:50%; border:2px solid; }
  .proto { font-size:10.5px; color:#555b7a; text-align:center; margin-top:10px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <button class="btn" id="up" aria-label="לשרשור האב">↑</button>
  <div class="crumbs" id="crumbs"></div>
  <button class="btn" id="home" aria-label="לבוס">⌂</button>
</div>
<div class="hint" id="hint">גרירה מסובבת · צביטה מקרבת · הקשה על כדור נכנסת לשרשור</div>
<div class="sheet" id="sheet">
  <div class="grab" id="grab"></div>
  <div class="head"><span class="dot" id="s-dot"></span><h1 id="s-title"></h1></div>
  <div class="meta" id="s-meta"></div>
  <div class="msgs" id="s-msgs"></div>
  <div id="s-prog"></div>
  <div class="kids-h" id="s-kids-h"></div>
  <div class="kids" id="s-kids"></div>
  <div class="legend" id="legend"></div>
  <div class="proto">אב־טיפוס · נתונים מומצאים · לא מחובר לקליאו</div>
</div>
<script>
'use strict';
// ---------- invented sample data: every thread starts in Boss; sub-threads are opened by other rooms ----------
const ROOMS = {
  boss:     { name:'בוס',      color:'#f4c95d' },
  build:    { name:'בנייה',    color:'#7c9cff' },
  qa:       { name:'בדיקות',   color:'#4fd1c5' },
  design:   { name:'עיצוב',    color:'#e879f9' },
  strategy: { name:'אסטרטגיה', color:'#fb923c' },
  finance:  { name:'כספים',    color:'#a3e635' },
  research: { name:'מחקר',     color:'#94a3b8' },
};
const STATUS = {
  done:     { name:'הושלם',   color:'#3ecf8e' },
  working:  { name:'בעבודה',  color:'#f5a524' },
  waiting:  { name:'ממתין',   color:'#5aa9ff' },
  question: { name:'שאלה לדירקטור', color:'#ff5c8a' },
};
const T = (room, title, status, by, msgs, kids = []) => ({ room, title, status, by, msgs, kids });
const DATA = T('boss', 'בוס', 'working', null, [['קליאו', 'כל שרשור מתחיל כאן. 5 בקשות פתוחות, 2 מחכות להחלטה.']], [
  T('boss', 'אתר הזמנות ללקוח חדש', 'working', 'אורן', [['אורן', 'בנו אתר הזמנות, שיעבוד מהטלפון.'], ['קליאו', 'פתחתי 3 שרשורים: בנייה, טופס ותוכן.']], [
    T('build', 'שלד האתר ודף הבית', 'done', 'קליאו', [['בנייה', 'דף הבית עלה לסביבת בדיקה.']], [
      T('design', 'צבעים ולוגו', 'done', 'בנייה', [['עיצוב', 'שלוש אפשרויות, נבחרה הכהה.']]),
      T('qa', 'בדיקת טלפון — דף הבית', 'done', 'בנייה', [['בדיקות', 'נבדק באייפון ובאנדרואיד. עובר.']]),
    ]),
    T('build', 'טופס הזמנה', 'working', 'קליאו', [['בנייה', 'הטופס עובד, חסר חיבור לחשבונית.']], [
      T('qa', 'בדיקת הטופס מקצה לקצה', 'working', 'בנייה', [['בדיקות', '2 מתוך 5 תרחישים עוברים.']], [
        T('build', 'תיקון: שדה טלפון לא נשמר', 'working', 'בדיקות', [['בנייה', 'מצאתי, מתקן.']]),
      ]),
      T('finance', 'חיבור לחשבונית', 'question', 'בנייה', [['כספים', 'צריך אישור דירקטור לחבר את מערכת החשבונות.']]),
    ]),
    T('strategy', 'נוסח המייל ללקוח', 'waiting', 'קליאו', [['אסטרטגיה', 'הטיוטה מוכנה, מחכה לסיום האתר.']], [
      T('design', 'תמונות למייל', 'done', 'אסטרטגיה', [['עיצוב', 'שלוש תמונות מסך מוכנות.']]),
    ]),
  ]),
  T('boss', 'דוח בוקר לדירקטורים', 'done', 'אלעד', [['אלעד', 'כל בוקר סיכום קצר בוואטסאפ.'], ['קליאו', 'פועל מאז יום שני.']], [
    T('build', 'איסוף הכרטיסים הפתוחים', 'done', 'קליאו', [['בנייה', 'נאסף מכל החדרים.']]),
    T('build', 'סיכום ב־600 תווים', 'done', 'קליאו', [['בנייה', 'מקוצר אוטומטית.']], [
      T('qa', 'בדיקה מול וואטסאפ', 'done', 'בנייה', [['בדיקות', 'נשלח לקבוצה ונקרא תקין.']]),
    ]),
  ]),
  T('boss', 'בוט פגישות שמתמלל בלייב', 'working', 'אורן', [['אורן', 'שיתמלל תוך כדי השיחה, לא אחריה.'], ['קליאו', 'ההצטרפות עובדת; התמלול החי בבנייה.']], [
    T('build', 'הצטרפות אוטומטית לשיחה', 'done', 'קליאו', [['בנייה', 'מצטרף ונשאר עד סוף השיחה.']]),
    T('build', 'תמלול חי בעברית', 'working', 'קליאו', [['בנייה', 'עובד באנגלית, עברית בבדיקה.']], [
      T('research', 'השוואת מנועי תמלול', 'done', 'בנייה', [['מחקר', 'שלושה מנועים נבדקו, אחד נבחר.']]),
      T('build', 'זיהוי מי מדבר', 'working', 'בנייה', [['בנייה', 'מזהה 2 דוברים, לא 4.']], [
        T('qa', 'בדיקה עם 4 משתתפים', 'waiting', 'בנייה', [['בדיקות', 'מחכה לתיקון.']]),
      ]),
      T('qa', 'שיחת ניסיון', 'waiting', 'בנייה', [['בדיקות', 'מחכה שאורן יהיה פנוי.']]),
    ]),
    T('design', 'שרשור לכל פגישה', 'done', 'קליאו', [['עיצוב', 'כל פגישה פותחת שרשור משלה.']]),
  ]),
  T('boss', 'הכנה לפגישת משקיעים', 'question', 'אלעד', [['אלעד', 'מצגת קצרה לשבוע הבא.'], ['קליאו', 'צריך החלטה: 10 שקפים או 6?']], [
    T('strategy', 'מצגת', 'working', 'קליאו', [['אסטרטגיה', 'שלד של 10 שקפים.']], [
      T('design', 'גרפים', 'working', 'אסטרטגיה', [['עיצוב', 'שניים מתוך ארבעה.']]),
      T('research', 'נתוני שוק', 'done', 'אסטרטגיה', [['מחקר', 'נאספו ממקורות ציבוריים.']]),
    ]),
    T('finance', 'תחזית לשנה', 'waiting', 'קליאו', [['כספים', 'מחכה לנתוני הרבעון.']]),
  ]),
  T('boss', 'כפתור משוב בלחיצה ימנית', 'done', 'אורן', [['אורן', 'כמו בכל מוצר — לחיצה ימנית ומשוב.'], ['קליאו', 'פעיל בכל הדפים.']], [
    T('build', 'תפריט לחיצה ימנית', 'done', 'קליאו', [['בנייה', 'עובד גם בלחיצה ארוכה בטלפון.']], [
      T('qa', 'בדיקה בטלפון', 'done', 'בנייה', [['בדיקות', 'עובר.']]),
    ]),
  ]),
]);

// ---------- tree bookkeeping ----------
const nodes = [];
(function index(n, parent, depth) {
  n.parent = parent; n.depth = depth; n.id = nodes.length; nodes.push(n);
  n.kids.forEach((k) => index(k, n, depth + 1));
  n.leaves = n.kids.length ? n.kids.reduce((s, k) => s + k.leaves, 0) : 1;
  n.all = n.kids.reduce((s, k) => s + 1 + k.all, 0);
})(DATA, null, 0);
const subtree = (n, f = []) => { f.push(n); n.kids.forEach((k) => subtree(k, f)); return f; };
const isUnder = (n, a) => { for (let p = n; p; p = p.parent) if (p === a) return true; return false; };

// ---------- cone-tree layout: children on a ring below their parent, arc share by subtree size ----------
const LEVEL = 2.6;
(function layout(n, x, y, z, a0, a1) {
  n.p = [x, y, z];
  if (!n.kids.length) return;
  const r = n.depth === 0 ? 6.5 : Math.max(1.8, 1.25 * Math.sqrt(n.leaves) / (1 + n.depth * 0.2));
  const span = n.depth === 0 ? Math.PI * 2 : Math.min(Math.PI * 2, Math.PI * 0.9 + n.kids.length * 0.35);
  const mid = n.depth === 0 ? 0 : (a0 + a1) / 2;
  let a = mid - span / 2;
  for (const k of n.kids) {
    const share = span * (k.leaves / n.leaves);
    const ang = a + share / 2; a += share;
    layout(k, x + r * Math.sin(ang), y - LEVEL, z + r * Math.cos(ang), ang - share / 2, ang + share / 2);
  }
})(DATA, 0, 0, 0, 0, Math.PI * 2);

// ---------- camera ----------
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();
const cam = { yaw: 0.5, pitch: 0.78, dist: 15, t: [0, -2.5, 0] };
const goal = { dist: 15, t: [0, -2.5, 0] };
let focus = DATA, lastTouch = performance.now();

function basis() {
  const cp = Math.cos(cam.pitch);
  const off = [cp * Math.sin(cam.yaw), Math.sin(cam.pitch), cp * Math.cos(cam.yaw)];
  const eye = [cam.t[0] + off[0] * cam.dist, cam.t[1] + off[1] * cam.dist, cam.t[2] + off[2] * cam.dist];
  const f = norm([-off[0], -off[1], -off[2]]);
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
function project(p, B) {
  const d = [p[0] - B.eye[0], p[1] - B.eye[1], p[2] - B.eye[2]];
  const z = dot(d, B.f); if (z < 0.3) return null;
  const F = Math.min(W, H * 0.9) * 1.1;
  const sheetH = sheet.classList.contains('min') ? 92 : sheet.offsetHeight;
  const cy = (H - sheetH) * 0.52 + 20;
  return { x: W / 2 + dot(d, B.r) * F / z, y: cy - dot(d, B.u) * F / z, z, s: F / z };
}

function setFocus(n, fromUser = true) {
  focus = n;
  const sub = subtree(n);
  let lo = Infinity, hi = -Infinity, rad = 0;
  for (const s of sub) { lo = Math.min(lo, s.p[1]); hi = Math.max(hi, s.p[1]); rad = Math.max(rad, Math.hypot(s.p[0] - n.p[0], s.p[2] - n.p[2])); }
  goal.t = [n.p[0], (lo + hi) / 2, n.p[2]];
  goal.dist = Math.max(6, Math.max(rad * 2.2, (hi - lo) * 1.6) + 5);
  if (fromUser) lastTouch = performance.now();
  renderSheet();
}

// ---------- drawing ----------
const rgba = (hex, a) => { const v = parseInt(hex.slice(1), 16); return `rgba(${v >> 16},${(v >> 8) & 255},${v & 255},${a})`; };
const stars = Array.from({ length: 140 }, () => [Math.random(), Math.random(), Math.random() * 1.2 + 0.2]);
let proj = [];
function frame(now) {
  const ease = 0.09;
  for (let i = 0; i < 3; i++) cam.t[i] += (goal.t[i] - cam.t[i]) * ease;
  cam.dist += (goal.dist - cam.dist) * ease;
  if (!drag && now - lastTouch > 3500) cam.yaw += 0.0016;
  cam.pitch = Math.max(-0.2, Math.min(1.35, cam.pitch));

  cx.clearRect(0, 0, W, H);
  for (const [sx, sy, sr] of stars) { cx.fillStyle = `rgba(180,190,255,${0.15 + sr * 0.15})`; cx.fillRect(((sx * W + cam.yaw * 40) % W + W) % W, sy * H, sr, sr); }

  const B = basis();
  proj = nodes.map((n) => ({ n, q: project(n.p, B) }));
  const alphaOf = (n) => (isUnder(n, focus) ? 1 : (focus.parent && n === focus.parent) ? 0.55 : 0.13);

  // edges
  for (const { n, q } of proj) {
    if (!n.parent || !q) continue;
    const pq = proj[n.parent.id].q; if (!pq) continue;
    const a = Math.min(alphaOf(n), alphaOf(n.parent) + 0.3);
    const g = cx.createLinearGradient(pq.x, pq.y, q.x, q.y);
    g.addColorStop(0, rgba(ROOMS[n.parent.room].color, a * 0.6)); g.addColorStop(1, rgba(ROOMS[n.room].color, a * 0.6));
    cx.strokeStyle = g; cx.lineWidth = Math.max(0.6, Math.min(2.4, q.s * 0.018));
    cx.beginPath(); cx.moveTo(pq.x, pq.y);
    const my = (pq.y + q.y) / 2; cx.bezierCurveTo(pq.x, my, q.x, my, q.x, q.y); cx.stroke();
  }

  // nodes, far to near
  const order = proj.filter((o) => o.q).sort((a, b) => b.q.z - a.q.z);
  for (const { n, q } of order) {
    const a = alphaOf(n);
    const base = n.depth === 0 ? 0.55 : n === focus ? 0.42 : 0.26 + Math.min(0.12, n.all * 0.015);
    const r = Math.max(4, base * q.s * 0.1);
    q.r = r;
    const col = ROOMS[n.room].color;
    const glow = cx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r * 2.6);
    glow.addColorStop(0, rgba(col, 0.35 * a)); glow.addColorStop(1, rgba(col, 0));
    cx.fillStyle = glow; cx.beginPath(); cx.arc(q.x, q.y, r * 2.6, 0, 7); cx.fill();
    const body = cx.createRadialGradient(q.x - r * 0.35, q.y - r * 0.35, r * 0.1, q.x, q.y, r);
    body.addColorStop(0, rgba('#ffffff', 0.9 * a)); body.addColorStop(0.35, rgba(col, a)); body.addColorStop(1, rgba(col, 0.55 * a));
    cx.fillStyle = body; cx.beginPath(); cx.arc(q.x, q.y, r, 0, 7); cx.fill();
    // status ring
    cx.strokeStyle = rgba(STATUS[n.status].color, a); cx.lineWidth = Math.max(1.2, r * 0.18);
    cx.beginPath(); cx.arc(q.x, q.y, r + cx.lineWidth * 1.2, 0, 7); cx.stroke();
    if (n.status === 'question') { // a director decision pulses
      const p = (now % 1600) / 1600;
      cx.strokeStyle = rgba(STATUS.question.color, (1 - p) * a); cx.lineWidth = 2;
      cx.beginPath(); cx.arc(q.x, q.y, r * (1.3 + p * 1.4), 0, 7); cx.stroke();
    }
    if (n === focus) {
      cx.strokeStyle = 'rgba(255,255,255,.85)'; cx.lineWidth = 1.5; cx.setLineDash([4, 4]); cx.lineDashOffset = -now / 60;
      cx.beginPath(); cx.arc(q.x, q.y, r * 1.9, 0, 7); cx.stroke(); cx.setLineDash([]);
    }
  }

  // labels: the focused thread, its parent and its children
  cx.textAlign = 'center'; cx.direction = 'rtl';
  const placed = [];
  const labelled = order.filter(({ n }) => n === focus || n.parent === focus || n === focus.parent)
    .sort((a, b) => (b.n === focus) - (a.n === focus) || a.q.z - b.q.z);
  for (const { n, q } of labelled) {
    const big = n === focus;
    cx.font = `${big ? 600 : 500} ${big ? 14 : 12}px -apple-system,Segoe UI,Arial,sans-serif`;
    const label = n.title + (n.kids.length && !big ? `  ·${n.all}` : '');
    const w = cx.measureText(label).width + 14;
    let y = q.y + q.r + (big ? 22 : 18);
    const hit = (yy) => placed.some((b) => Math.abs(b.x - q.x) < (b.w + w) / 2 && Math.abs(b.y - yy) < 21);
    if (hit(y)) y = q.y - q.r - 14;
    if (hit(y)) continue;
    placed.push({ x: q.x, y, w });
    cx.fillStyle = n === focus.parent ? 'rgba(10,12,22,.55)' : 'rgba(10,12,22,.78)';
    roundRect(q.x - w / 2, y - 13, w, 20, 10); cx.fill();
    cx.fillStyle = n === focus.parent ? 'rgba(232,234,246,.6)' : '#e8eaf6';
    cx.fillText(label, q.x, y + 2);
  }
  requestAnimationFrame(frame);
}
function roundRect(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }

// ---------- touch: drag rotates, pinch zooms, tap enters a thread, double-tap empty goes up ----------
const pts = new Map(); let drag = null, pinch0 = null, lastTapEmpty = 0;
cv.addEventListener('pointerdown', (e) => {
  cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
  drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: 0 };
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), dist: goal.dist }; }
  lastTouch = performance.now(); hint.style.opacity = 0;
});
cv.addEventListener('pointermove', (e) => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2 && pinch0) {
    const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    goal.dist = cam.dist = Math.max(3, Math.min(40, pinch0.dist * pinch0.d / d)); drag.moved = 99; return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy));
  cam.yaw -= dx * 0.008; cam.pitch += dy * 0.006; lastTouch = performance.now();
});
const end = (e) => {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch0 = null;
  if (drag && drag.moved < 8 && pts.size === 0 && e.type === 'pointerup') tap(e.clientX, e.clientY);
  if (pts.size === 0) drag = null;
};
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
cv.addEventListener('wheel', (e) => { e.preventDefault(); goal.dist = Math.max(3, Math.min(40, goal.dist * (1 + e.deltaY * 0.001))); }, { passive: false });
function tap(x, y) {
  let best = null, bd = Infinity;
  for (const { n, q } of proj) {
    if (!q || !q.r) continue;
    const d = Math.hypot(q.x - x, q.y - y);
    if (d < Math.max(q.r * 1.6, 22) && q.z < bd) { best = n; bd = q.z; }
  }
  if (best) { if (navigator.vibrate) navigator.vibrate(8); setFocus(best); sheet.classList.remove('min'); return; }
  const now = performance.now();
  if (now - lastTapEmpty < 350 && focus.parent) setFocus(focus.parent);
  lastTapEmpty = now;
}

// ---------- the sheet ----------
const sheet = document.getElementById('sheet'), hint = document.getElementById('hint');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function renderSheet() {
  const n = focus;
  $('s-dot').style.background = $('s-dot').style.color = ROOMS[n.room].color;
  $('s-title').textContent = n.title;
  $('s-meta').innerHTML =
    `<span class="tag">חדר <b>${ROOMS[n.room].name}</b></span>` +
    `<span class="tag" style="color:${STATUS[n.status].color}">● ${STATUS[n.status].name}</span>` +
    (n.by ? `<span class="tag">נפתח ע״י <b>${esc(n.by)}</b></span>` : '') +
    (n.depth ? `<span class="tag">רמה ${n.depth}</span>` : '');
  $('s-msgs').innerHTML = n.msgs.map(([who, t]) => `<p class="msg"><i>${esc(who)}:</i>${esc(t)}</p>`).join('');
  const sub = subtree(n).slice(1);
  if (sub.length) {
    const c = {}; sub.forEach((s) => (c[s.status] = (c[s.status] || 0) + 1));
    $('s-prog').innerHTML = `<div class="bar">${Object.keys(STATUS).filter((k) => c[k]).map((k) => `<span style="width:${100 * c[k] / sub.length}%;background:${STATUS[k].color}"></span>`).join('')}</div>` +
      `<div class="small">${c.done || 0} מתוך ${sub.length} תתי־שרשורים הושלמו${c.question ? ` · ${c.question} מחכים להחלטה` : ''}</div>`;
  } else $('s-prog').innerHTML = '';
  $('s-kids-h').textContent = n.kids.length ? `נפתחו מכאן (${n.kids.length})` : 'אין תתי־שרשורים';
  $('s-kids').innerHTML = n.kids.map((k) =>
    `<button class="kid" data-id="${k.id}"><span class="dot" style="background:${ROOMS[k.room].color};color:${ROOMS[k.room].color}"></span>` +
    `<span class="t">${esc(k.title)}</span><span class="n" style="color:${STATUS[k.status].color}">${STATUS[k.status].name}</span>` +
    `${k.all ? `<span class="n">↓${k.all}</span>` : ''}<span class="chev">‹</span></button>`).join('');
  // breadcrumbs
  const path = []; for (let p = n; p; p = p.parent) path.unshift(p);
  $('crumbs').innerHTML = path.map((p, i) => `${i ? '<span class="sep">‹</span>' : ''}<button class="crumb${p === n ? ' cur' : ''}" data-id="${p.id}">${esc(p.title)}</button>`).join('');
  $('crumbs').scrollLeft = -1e5;
  $('up').disabled = !n.parent;
}
$('s-kids').addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (b) setFocus(nodes[+b.dataset.id]); });
$('crumbs').addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (b) setFocus(nodes[+b.dataset.id]); });
$('up').onclick = () => focus.parent && setFocus(focus.parent);
$('home').onclick = () => setFocus(DATA);
$('grab').onclick = () => sheet.classList.toggle('min');
$('legend').innerHTML = Object.values(ROOMS).map((r) => `<span><span class="dot" style="background:${r.color}"></span>${r.name}</span>`).join('') +
  Object.values(STATUS).map((s) => `<span><span class="ring" style="border-color:${s.color}"></span>${s.name}</span>`).join('');
setTimeout(() => (hint.style.opacity = 0), 6000);

setFocus(DATA, false);
requestAnimationFrame(frame);
</script>
</body>
