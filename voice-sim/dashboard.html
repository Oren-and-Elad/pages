<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Cleo</title>
<link rel="icon" href="favicon-c2.svg">
<script>
  // The dashboard is a room in the console (Oren, 21 Oct 2026): opened on its own, this page goes to that room.
  if (window.top === window.self) location.replace('./index.html#dashboard');
</script>
<style>
  :root { --bg:#0c0e14; --card:#151925; --card2:#1a2030; --line:#262d40; --ink:#f4ecd6; --dim:#8f98ab; --acc:#d97757; --acc2:#e8a25a; --ok:#3cc874; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; color:var(--ink); font:15px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
    background: radial-gradient(1200px 600px at 85% -10%, rgba(217,119,87,.16), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(232,162,90,.08), transparent 60%), var(--bg); }
  header { display:flex; gap:12px; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line);
    background: rgba(12,14,20,.7); backdrop-filter: blur(10px); position:sticky; top:0; z-index:20; }
  header img { width:38px; height:38px; border-radius:50%; object-fit:cover; border:2px solid var(--acc); }
  header .title { flex:1; min-width:0; }
  header h1 { font-size:19px; margin:0; letter-spacing:.2px; }
  header .sub { color:var(--dim); font-size:13px; }
  a, button { color:var(--ink); background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:7px 12px;
    font:inherit; font-size:14px; text-decoration:none; cursor:pointer; transition: background .15s, border-color .15s, transform .15s; }
  a:hover, button:hover { border-color:var(--acc); }
  button.primary { background: linear-gradient(135deg, var(--acc), var(--acc2)); border-color:transparent; color:#1b0f08; font-weight:600; }
  button.primary:hover { transform: translateY(-1px); }
  #grid { position:relative; margin:18px; }
  .card { position:absolute; background: linear-gradient(180deg, var(--card2), var(--card)); border:1px solid var(--line); border-radius:16px;
    display:flex; flex-direction:column; overflow:hidden; box-shadow: 0 6px 22px rgba(0,0,0,.28); transition: border-color .15s, box-shadow .15s; }
  .card:hover { border-color: rgba(217,119,87,.55); box-shadow: 0 10px 30px rgba(0,0,0,.38); }
  .card .bar { display:flex; gap:6px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); cursor:grab; user-select:none; touch-action:none; }
  .card .bar b { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px; unicode-bidi:plaintext; text-align:start; }
  .card .bar button { padding:3px 8px; font-size:13px; background:transparent; border-color:transparent; color:var(--dim); }
  .card .bar button:hover { color:var(--ink); background:var(--card2); border-color:var(--line); }
  /* Hebrew reads right-to-left (Oren, 21 Oct): each paragraph takes its own direction, so a Hebrew line aligns right */
  .card .body { flex:1; overflow:auto; padding:12px 14px; white-space:pre-wrap; unicode-bidi:plaintext; text-align:start; font-size:15px; }
  .card .body.html { padding:0; border:0; width:100%; min-height:0; background:transparent; }
  .card .body.empty { color:var(--dim); font-style:italic; }
  .card .foot { color:var(--dim); font-size:12px; padding:6px 14px 10px; display:flex; align-items:center; gap:6px; }
  .card .foot::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--acc); opacity:.8; }
  .card .grip { position:absolute; right:0; bottom:0; width:18px; height:18px; cursor:nwse-resize; touch-action:none; background:linear-gradient(135deg, transparent 50%, var(--dim) 50%); opacity:.45; }
  .card form { display:flex; flex-direction:column; gap:8px; padding:12px; flex:1; overflow:auto; }
  .card.editing { z-index:5; height:auto !important; min-height:300px; border-color:var(--acc); }
  input, textarea { background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; unicode-bidi:plaintext; text-align:start; }
  input:focus, textarea:focus { outline:none; border-color:var(--acc); }
  .card textarea { min-height:90px; }
  #msg { color:var(--dim); padding:0 18px; }
  /* Tiles (Oren, 23 Oct 2026): one icon, one value, one colour, a few words per card; a tap opens the card */
  header button, #sum { white-space:nowrap; }
  #sum { margin-inline-end:auto; font-weight:700; font-size:16px; padding:6px 12px; border-radius:999px; direction:rtl; unicode-bidi:plaintext; }
  #sum.ok { color:var(--ok); background:rgba(60,200,116,.12); } #sum.warn { color:#e8a25a; background:rgba(232,162,90,.14); } #sum.bad { color:#e5534b; background:rgba(229,83,75,.14); }
  #grid.tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; direction:rtl; }
  .tile { display:flex; flex-direction:column; align-items:flex-start; gap:2px; height:128px; padding:12px 14px; border-radius:16px; text-align:start;
    background:var(--card2); border:1px solid var(--line); overflow:hidden; }
  .tile .ic { font-size:20px; min-height:24px; } .tile .v { font-size:44px; font-weight:800; line-height:1.05; color:var(--dim); white-space:nowrap; }
  .tile .l { font-size:13px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .tile.s-ok { border-color:#2c6b47; } .tile.s-ok .v { color:var(--ok); }
  .tile.s-warn { border-color:#7a5a30; background:#2a2218; } .tile.s-warn .v { color:#e8a25a; }
  .tile.s-bad { border-color:#7a3330; background:#2c1a1c; } .tile.s-bad .v { color:#e5534b; }
  .tile:hover { transform:translateY(-1px); }
  #grid.one .card.detail { position:relative; width:100%; height:calc(100vh - 130px); min-height:360px; }
  #grid.one .card.detail.editing { height:auto; }
  /* Inside the console's dashboard room the console's top bar names the room: only the page's own buttons stay */
  body.embed header { justify-content:flex-end; padding:10px 18px; }
  body.embed header img, body.embed header .title, body.embed #back { display:none; }
  #msg:empty { display:none; }
  /* 🎯 feedback — the console's own popover and right-click menu */
  #fb-pop { position:fixed; z-index:1000; width:min(340px, calc(100vw - 16px)); background:var(--card2); border:1px solid var(--line);
    border-radius:14px; box-shadow:0 12px 36px rgba(0,0,0,.45); padding:12px; display:flex; flex-direction:column; gap:8px; font-size:14px; }
  #fb-pop .what { font-weight:600; overflow-wrap:anywhere; }
  #fb-pop textarea { width:100%; min-height:72px; resize:vertical; }
  #fb-pop .row { display:flex; gap:6px; justify-content:flex-end; }
  #fb-menu { position:fixed; z-index:1001; min-width:210px; background:var(--card2); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 8px 26px rgba(0,0,0,.35); padding:4px; font-size:13px; }
  #fb-menu button { display:block; width:100%; text-align:left; border:0; background:none; font-weight:600; padding:7px 10px; }
  #fb-menu button:hover { background:var(--bg); }
  #fb-menu .hint { color:var(--dim); font-size:11px; padding:2px 10px 5px; }
  .fb-target { outline:2px solid var(--acc) !important; outline-offset:2px; }
  #fb-chip { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:1002; background:var(--card2); border:1px solid var(--line);
    border-radius:999px; padding:8px 16px; box-shadow:0 8px 24px rgba(0,0,0,.4); font-size:14px; }
  #fb-chip.err { background:#3a0d0d; color:#ffd7d0; border-color:#a33; font-weight:600; }
</style>
</head>
<body>
<script>if (window.top !== window.self) document.body.classList.add('embed');</script>
<header>
  <img src="assets/cleo.jpg" alt="" onerror="this.remove()">
  <div class="title"><h1>Dashboard</h1><div class="sub">Your morning cards — each runs once a day at its time</div></div>
  <span id="sum" title="Red = a problem today · orange = worth a look · when the cards last ran (Sydney)"></span>
  <button id="view" type="button" title="Switch between the tiles and the free layout (move, resize)">⊞ Layout</button>
  <button id="feedback" type="button" title="Feedback on this dashboard — goes to Cleo in Boss (or right-click anything)">🎯 Feedback</button>
  <button id="add" class="primary" type="button">+ Card</button>
  <a id="back" href="./index.html" target="_top" title="Back to the rooms and their threads">Rooms &amp; threads →</a>
</header>
<p id="msg"></p>
<div id="grid"></div>
<script type="module" src="./dashboard.js"></script>
</body>
</html>
