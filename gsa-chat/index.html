<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ask your project files</title>
<style>
  /* One answerer room on its own, in its client's look (ADR-2610281312jh; ask-logic.mjs ASK_ROOMS sets the variables) */
  :root { --bg:#ebebeb; --panel:#fff; --accent:#c2ae8b; --muted:#86847b; --line:#b9b7ae; --ink:#1f1f1f; --onaccent:#1f1f1f; --tint:#f4f1ea; --font:Arial, Helvetica, sans-serif; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font:18px/1.5 var(--font); }
  header { display:flex; align-items:center; gap:20px; padding:18px 28px; background:var(--panel); border-bottom:3px solid var(--accent); }
  header img { height:36px; width:auto; }
  header h1 { margin:0; font-size:22px; font-weight:400; color:var(--muted); letter-spacing:.3px; border-left:1px solid var(--line); padding-left:20px; }
  main { flex:1; width:100%; max-width:1040px; margin:0 auto; padding:8px 32px 96px; }
  input { flex:1; min-width:0; padding:14px 16px; font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:10px; unicode-bidi:plaintext; }
  input:focus { outline:none; border-color:var(--accent); }
  button { padding:0 26px; font:inherit; font-weight:700; color:var(--onaccent); background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #msg { color:var(--muted); text-align:center; padding:8px; }
  #msg a { color:var(--ink); }
  /* the live answers (Oren, 3 Nov 2026, #gsa: mockup v2 + the declutter rules; ask-view.js). Read from 3 m on a projector:
     big type, dark ink, one accent (the sand) and the status tags, nothing else. */
  form#ask { display:flex; gap:10px; width:100%; max-width:1040px; margin:0 auto; padding:28px 32px 0; }
  form#ask[hidden] { display:none; }
  form#ask input { font-size:20px; padding:16px 20px; border-radius:14px; border:2px solid var(--line); }
  form#ask input:focus { border-color:var(--accent); }
  form#ask button { font-size:19px; padding:0 30px; border-radius:12px; background:var(--ink); color:var(--panel); }
  #live { background:var(--bg); } /* the warm page; the cards stay white (Oren, 3 Nov 2026: "too grey and boring") */
  .empty { color:var(--muted); text-align:center; margin-top:14vh; font-size:22px; }
  .ex { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; } .ex span { color:var(--muted); padding:10px 0; }
  .ex button { color:var(--ink); font:inherit; font-size:17px; font-weight:400; padding:10px 18px; background:var(--panel); border:1px solid var(--line); border-radius:999px; }
  .ex button:hover { border-color:var(--accent); }
  .ans { margin-top:36px; animation:rise .3s ease both; }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .echo { display:flex; gap:12px; align-items:baseline; margin:0 0 10px; font-size:18px; color:#4a4943; unicode-bidi:plaintext; }
  .echo b { flex:none; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .ans h2 { margin:0; font-size:48px; line-height:1.1; letter-spacing:-.5px; }
  .lead { margin:14px 0 24px; max-width:880px; font-size:23px; line-height:1.45; unicode-bidi:plaintext; }
  .lead.plain { font-size:21px; }
  .wait { color:var(--muted); font-size:21px; margin:18px 0; }
  .tools { display:flex; gap:10px; margin:0 0 16px; }
  .tool { font:inherit; font-size:16px; font-weight:700; padding:9px 18px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:999px; }
  .tool.on { color:var(--onaccent); background:var(--accent); border-color:var(--accent); }
  .strip { width:100%; border-collapse:collapse; margin:0 0 20px; font-size:18px; }
  .strip th { text-align:left; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:8px 12px; border-bottom:2px solid var(--accent); }
  .strip td { padding:10px 12px; border-bottom:1px solid #e6e4de; } .strip td.k { font-weight:700; }
  .bar { margin:0 0 18px; padding:14px 16px; border:1px solid #e6e4de; border-radius:14px; }
  .frow { display:flex; flex-wrap:wrap; align-items:center; gap:8px; } .frow + .frow { margin-top:10px; }
  .frow .lbl { min-width:90px; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .chip { font:inherit; font-size:16px; font-weight:400; padding:6px 14px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:999px; }
  .chip.on { background:var(--ink); border-color:var(--ink); color:var(--panel); } .chip em { font-style:normal; opacity:.6; margin-left:6px; }
  .card { border:1px solid #e3e0d8; border-radius:16px; margin:0 0 14px; background:var(--panel); box-shadow:0 1px 2px #0000000a, 0 2px 8px #0000000a; }
  .card.open { border-color:var(--accent); box-shadow:0 2px 4px #0000000d, 0 14px 36px #00000014; }
  .card .top { display:block; width:100%; text-align:left; font:inherit; font-weight:400; color:var(--ink); background:transparent; padding:18px 24px; border-radius:16px; }
  .card .l1 { display:flex; justify-content:space-between; align-items:baseline; gap:24px; }
  .card .place { font-size:22px; font-weight:700; line-height:1.3; } .card .cn { color:#4a4943; font-weight:400; }
  .card .key { flex:none; font-size:22px; font-weight:800; text-align:right; }
  .card .l2 { display:flex; align-items:center; gap:14px; margin-top:8px; }
  .card .nt { font-size:16px; color:#4a4943; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .card .chev { margin-left:auto; flex:none; font-size:15px; color:var(--muted); }
  .tag { flex:none; font-size:15px; font-weight:700; padding:3px 10px; border-radius:8px; }
  .tag.ok { color:#14603b; background:#e3f3ea; } .tag.no { color:#a1190f; background:#fde9e7; } .tag.wait { color:#8a4f00; background:#fff1d9; } .tag.unk { color:#4a4943; background:#eeede9; }
  .card .body { margin:0 24px; padding:18px 0 22px; border-top:1px solid #e6e4de; }
  .facts { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; } .facts span { font-size:17px; padding:5px 10px; border-radius:8px; background:#f4f3ef; }
  .facts i { font-style:normal; color:var(--muted); margin-right:6px; }
  .card .note { margin:0 0 14px; font-size:18px; }
  .card blockquote { margin:0; padding:14px 20px; font-size:19px; line-height:1.5; background:var(--tint); border-left:4px solid var(--accent); border-radius:0 10px 10px 0; unicode-bidi:plaintext; }
  .card blockquote small, .card .where { display:block; margin-top:8px; font-size:15px; color:#5c5a53; }
  .card a.link { display:inline-block; margin-top:12px; font-size:16px; font-weight:600; color:var(--accent); text-decoration:underline; text-decoration-color:var(--accent); text-underline-offset:3px; }
  .earlier { display:block; margin:28px 0 0; font:inherit; font-size:16px; font-weight:700; padding:10px 18px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:999px; }
  /* prepared answers beside the live question (ask-logic.mjs preparedTabs/preparedDoc) */
  nav#tabs { display:flex; flex-wrap:wrap; gap:6px; padding:12px 28px; background:var(--panel); border-bottom:1px solid var(--line); }
  nav#tabs[hidden], #prepared[hidden], #live[hidden] { display:none; }
  nav#tabs button { color:var(--ink); padding:7px 12px; font-size:15px; font-weight:400; background:var(--bg); border-radius:16px; }
  nav#tabs button.on { color:var(--onaccent); background:var(--accent); font-weight:700; }
  nav#tabs button.live { margin-left:auto; font-weight:700; border:1px solid var(--accent); }
  nav#tabs { flex-direction:column; gap:8px; }
  nav#tabs .top { display:flex; align-items:center; gap:10px; } nav#tabs .top > .g { flex:1; }
  nav#tabs .g { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  nav#tabs .gt { font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); margin-right:6px; }
  nav#tabs .g.lead { padding:10px 12px; border:2px solid var(--accent); border-radius:12px; background:var(--tint); }
  nav#tabs .g.lead .gt { font-size:14px; color:var(--ink); }
  nav#tabs .g.lead button { color:var(--ink); font-size:17px; font-weight:700; padding:9px 16px; background:var(--panel); border:1px solid var(--accent); }
  nav#tabs .g.lead button.on { color:var(--onaccent); background:var(--accent); }
  #scope { padding:9px 28px; font-size:14px; color:#3d3d3d; background:var(--tint); border-bottom:1px solid var(--line); }
  #scope[hidden] { display:none; }
  /* what's in this demo (Oren, 3 Nov 2026, #gsa): the trust line opens a table of every job the search covers */
  button#scope { font:inherit; font-size:14px; font-weight:400; color:#3d3d3d; cursor:default; }
  body.side button#scope.inv, button#scope.inv { font-size:15px; cursor:pointer; color:var(--ink); font-weight:700; text-decoration:underline; text-decoration-color:var(--accent); text-underline-offset:3px; }
  button#scope.inv:hover { border-color:var(--accent); }
  /* while answering (Oren, 3 Nov 2026): a soft sand light passes over file icons, the count rises to the trust line's
     number, at least SCAN_MIN_MS; then the cards fade in one after another. Nothing spins. */
  @property --n { syntax:'<integer>'; inherits:false; initial-value:0; }
  .scan { margin:26px 0 0; }
  .scan .files { position:relative; display:flex; gap:16px; padding:16px 2px; overflow:hidden; }
  .scan .fi { position:relative; flex:none; width:36px; height:46px; border:2px solid #dcd6c8; border-radius:3px 12px 3px 3px; background:#fbfaf6;
    animation:lit 1.6s ease-in-out infinite; animation-delay:calc(var(--d, 0ms) + var(--i) * 90ms); }
  .scan .fi::before { content:''; position:absolute; left:7px; right:7px; top:13px; height:16px; background:repeating-linear-gradient(#e2ddd1 0 2px, transparent 2px 6px); }
  .scan .files::after { content:''; position:absolute; top:0; bottom:0; left:0; width:160px; background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 25%, transparent), transparent);
    animation:sweep 1.6s ease-in-out infinite; animation-delay:var(--d, 0ms); }
  @keyframes sweep { from { transform:translateX(-160px); } to { transform:translateX(min(100vw, 1000px)); } }
  @keyframes lit { 0%, 100% { border-color:#dcd6c8; } 35% { border-color:var(--accent); background:var(--tint); } }
  .scan .count { margin:6px 0 0; font-size:22px; color:var(--muted); }
  .scan .n { font-weight:700; color:var(--ink); animation:tally 1.4s ease-out forwards; animation-delay:var(--d, 0ms); counter-reset:n var(--n); }
  .scan .n::after { content:counter(n); }
  @keyframes tally { to { --n:var(--to); } }
  .ans.reveal .cards > .card { animation:rise .45s ease both; animation-delay:calc(var(--i, 0) * 80ms); }
  .card.qcard { padding:16px 24px 18px; } .card.qcard h3 { margin:0 0 10px; font-size:15px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .card.qcard blockquote + blockquote, .card.qcard .note + blockquote { margin-top:10px; } .card.qcard .note { color:#4a4943; }
  @media (prefers-reduced-motion: reduce) { .scan .fi, .scan .files::after, .ans.reveal .cards > .card { animation:none; } .scan .n { animation-duration:1ms; } }
  .ans .cov { margin:10px 0 0; font-size:17px; color:#4a4943; }
  dialog#inv { width:min(1100px, 94vw); max-height:88vh; border:1px solid var(--line); border-radius:16px; padding:24px 28px; font:inherit; color:var(--ink); }
  dialog#inv h2 { margin:0; font-size:30px; } dialog#inv .sub { margin:6px 0 16px; font-size:18px; color:#4a4943; }
  dialog#inv .row { display:flex; gap:12px; align-items:center; margin:0 0 12px; }
  dialog#inv .row input { font-size:18px; padding:10px 14px; } dialog#inv .row span { color:#4a4943; font-size:16px; white-space:nowrap; }
  dialog#inv #invclose { color:var(--ink); padding:10px 20px; background:var(--bg); }
  table.jobs { width:100%; border-collapse:collapse; font-size:17px; }
  table.jobs th { position:sticky; top:0; background:var(--panel); text-align:left; border-bottom:2px solid var(--accent); padding:0; }
  table.jobs th button { width:100%; white-space:nowrap; text-align:left; font:inherit; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); background:transparent; padding:8px 10px; border-radius:0; }
  table.jobs th[aria-sort] button { color:var(--ink); }
  table.jobs td { padding:8px 10px; border-bottom:1px solid #e6e4de; vertical-align:top; } table.jobs td.k { font-weight:700; } table.jobs td.n { text-align:right; padding-right:24px; }
  dialog#inv .wrap { max-height:58vh; overflow-y:auto; }
  #prepared { flex:1; display:flex; flex-direction:column; }
  #prepared iframe { flex:1; width:100%; min-height:calc(100vh - 160px); border:0; background:var(--bg); }
  #gate { max-width:360px; margin:12vh auto; text-align:center; }
  #gate input { width:100%; margin:10px 0; }
  #gate button { padding:12px 26px; }
  #gate .err { color:#b00; min-height:1.4em; }
  #live { flex:1; display:flex; flex-direction:column; }
  #col { flex:1; min-width:0; display:flex; flex-direction:column; }
  #topbar { display:none; }
  /* design A (Oren's card, 2 Nov 2026): with prepared answers the page is a system — the tabs in a side menu, Halina's
     questions framed at its top, the open tab's name and the scope line in the top bar */
  body.side { flex-direction:row; }
  body.side aside { width:270px; flex:none; position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--panel); border-right:1px solid var(--line); }
  body.side header { flex-direction:column; align-items:flex-start; gap:6px; padding:18px 18px 8px; border-bottom:0; }
  body.side header img { height:32px; }
  body.side header h1 { border-left:0; padding-left:0; font-size:16px; }
  body.side nav#tabs { padding:6px 12px 24px; border-bottom:0; gap:14px; }
  body.side nav#tabs .g { flex-direction:column; align-items:stretch; gap:2px; flex-wrap:nowrap; }
  body.side nav#tabs .gt { margin:0 0 4px 8px; }
  body.side nav#tabs button, body.side nav#tabs .g.lead button { color:var(--ink); text-align:left; padding:8px 10px; font-size:15px; font-weight:400; background:transparent; border:0; border-radius:7px; }
  body.side nav#tabs .g.lead { padding:8px 6px; }
  body.side nav#tabs button:hover { background:var(--bg); }
  body.side nav#tabs button.on, body.side nav#tabs .g.lead button.on { color:var(--onaccent); background:var(--accent); font-weight:700; }
  body.side nav#tabs button.live { margin:0; font-weight:700; }
  body.side #topbar { display:flex; align-items:center; flex-wrap:wrap; gap:6px 14px; padding:12px 24px; background:var(--panel); border-bottom:3px solid var(--accent); }
  body.side #topbar b { font-size:18px; } body.side #topbar .muted { color:var(--muted); font-size:15px; }
  body.side #scope { margin-left:auto; max-width:60%; padding:4px 12px; font-size:13px; border:1px solid var(--line); border-radius:12px; }
  body.side #prepared iframe { min-height:calc(100vh - 60px); }
  /* the menu folds (Oren, 2 Nov 2026): ☰ hides it and the page takes the whole width; each tab carries its step number */
  body.side #fold { color:var(--ink); padding:4px 10px; font-size:20px; line-height:1; background:transparent; border:1px solid var(--line); border-radius:7px; }
  body.side #next { padding:6px 14px; font-size:15px; }
  body.side.folded aside { display:none; }
  body.side.folded form#ask { max-width:1040px; }
  nav#tabs .n { display:inline-block; min-width:1.6em; margin-right:8px; padding:0 5px; font-size:13px; font-weight:700; text-align:center; color:var(--ink); background:var(--bg); border-radius:9px; }
  nav#tabs button.on .n { background:var(--panel); }
  /* the presenter mode (Oren, 3 Nov 2026, #gsa: "like slide clicks", desktop only): one screen at a time, the step number
     small at the top, a big Next → at the bottom right (or the → key); Enter asks. Normal mode is untouched. */
  #present { display:none; }
  body.side #present { color:var(--ink); display:inline-block; padding:6px 14px; font-size:15px; background:var(--panel); border:1px solid var(--accent); }
  body.side #present[hidden] { display:none; }
  @media (max-width: 899px) { body.side #present { display:none; } }
  #pres { display:none; }
  body.presenting > aside, body.presenting > #col, body.presenting #fbgo { display:none; }
  body.presenting #pres { flex:1; display:flex; flex-direction:column; min-height:100vh; background:var(--panel); }
  #pres .phead { display:flex; align-items:center; gap:18px; padding:14px 32px; border-bottom:3px solid var(--accent); }
  #pres .phead img { height:30px; width:auto; }
  #pcount { font-size:14px; font-weight:700; letter-spacing:.08em; color:var(--muted); }
  #pexit { margin-left:auto; padding:6px 12px; font-size:13px; font-weight:400; color:var(--muted); background:transparent; border:1px solid var(--line); }
  #pmain { flex:1; width:100%; max-width:1100px; margin:0 auto; padding:28px 40px 140px; }
  #ptitle { margin:0 0 18px; font-size:34px; letter-spacing:-.3px; }
  #pres .sub { margin:0 0 18px; font-size:20px; color:#4a4943; }
  form#pask { display:flex; gap:14px; align-items:stretch; margin:0 0 8px; }
  form#pask[hidden] { display:none; }
  form#pask textarea { flex:1; min-height:176px; padding:18px 22px; font:inherit; font-size:24px; line-height:1.4; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:14px; resize:vertical; unicode-bidi:plaintext; }
  form#pask textarea:focus { outline:none; border-color:var(--accent); }
  form#pask button { font-size:22px; padding:0 36px; border-radius:12px; background:var(--ink); color:var(--panel); }
  #pans .ans { margin-top:24px; } #pans .echo { display:none; } /* the question is in the box above */
  #pframe { width:100%; min-height:calc(100vh - 220px); border:0; background:var(--bg); border-radius:12px; }
  #pnext { position:fixed; right:32px; bottom:28px; z-index:6; padding:18px 38px; font-size:26px; border-radius:16px; box-shadow:0 4px 18px #0003; }
  #pnext[hidden] { display:none; }
  /* feedback (Oren, 3 Nov 2026): right-click a part, or Feedback then tap it; the note box names the part */
  #fbgo { position:fixed; right:18px; bottom:24px; z-index:5; padding:10px 16px; font-size:15px; border-radius:22px; box-shadow:0 2px 8px #0003; }
  #fbgo[hidden] { display:none; }
  body.picking, body.picking * { cursor:crosshair !important; }
  body.picking #fbgo { background:var(--ink); color:var(--panel); }
  body.picking iframe { pointer-events:none; } /* a prepared answer's locked frame: the tap reaches #prepared (Fable on #1124) */
  .fb-on { outline:3px solid var(--accent) !important; outline-offset:2px; }
  dialog#fb { width:min(520px, 92vw); border:1px solid var(--line); border-radius:12px; padding:18px; font:inherit; color:var(--ink); }
  dialog#fb #fbon { margin:0 0 10px; font-size:14px; color:var(--muted); font-style:italic; }
  dialog#fb textarea { width:100%; min-height:110px; padding:10px; font:inherit; border:1px solid var(--line); border-radius:8px; unicode-bidi:plaintext; }
  dialog#fb .row { display:flex; gap:10px; justify-content:flex-end; margin-top:10px; } dialog#fb .row button { padding:10px 20px; }
  dialog#fb #fbcancel { color:var(--ink); background:var(--bg); } dialog#fb .err { color:#b00; }
  /* the chat (ADR-2611030930gc): one conversation like a chat app — oldest at the top, the box at the bottom, the question
     as a bubble on the right, each answer the same sourced cards; sized for a laptop or a phone, not a projector */
  #signin, #chatbar, #chatlist, #signout { display:none; }
  #signin[hidden], #chatbar[hidden], #chatlist[hidden] { display:none !important; }
  body.chat #signin { display:block; max-width:440px; margin:10vh auto 0; padding:28px 28px 22px; background:var(--panel); border:1px solid var(--line); border-radius:16px; text-align:center; }
  #signin h2 { margin:0 0 6px; font-size:24px; } #signin p { margin:0 0 18px; color:#4a4943; font-size:16px; }
  #signin .or { margin:14px 0 0; color:var(--muted); font-size:14px; }
  #signin #google { padding:6px 10px; font-size:13px; font-weight:400; color:var(--muted); background:transparent; border:0; text-decoration:underline; }
  #signin form { display:flex; flex-direction:column; gap:10px; } #signin form input { padding:12px; font-size:16px; border:1px solid var(--line); border-radius:8px; }
  #signin form button { padding:12px; font-size:16px; background:var(--ink); color:var(--panel); }
  /* a guest's thumbs under each answer, and the general feedback box (ADR-2611030930gc) */
  .rate { display:flex; gap:8px; align-items:center; margin:12px 0 0; font-size:14px; color:var(--muted); }
  .rate button { color:var(--ink); padding:4px 12px; font-size:16px; background:var(--panel); border:1px solid var(--line); border-radius:999px; }
  .rate .done { font-size:14px; }
  body.chat #chatbar #gfbgo { margin-left:auto; }
  #signin #signmsg { margin:14px 0 0; min-height:1.4em; color:#4a4943; font-size:15px; }
  body.chat #topbar { display:flex; align-items:center; gap:10px; padding:10px 24px; background:var(--panel); border-bottom:3px solid var(--accent); }
  body.chat #topbar > :not(#scope):not(#signout):not(#fbgo) { display:none; }
  /* in the chat, Feedback sits in the top bar next to Sign out, so on a phone it never covers Send (Oren, 5 Nov 2026) */
  body.chat #topbar #fbgo { position:static; margin-left:auto; padding:5px 12px; font-size:14px; border-radius:12px; box-shadow:none; }
  body.chat #topbar #fbgo:not([hidden]) ~ #signout { margin-left:0; }
  body.chat #scope { padding:4px 12px; font-size:14px; border:1px solid var(--line); border-radius:12px; }
  body.chat #signout { display:inline-block; margin-left:auto; padding:5px 12px; font-size:14px; font-weight:400; color:var(--muted); background:transparent; border:1px solid var(--line); }
  body.chat #signout[hidden] { display:none; }
  body.chat header { border-bottom:0; }
  /* the three tabs (Oren + Elad, 5 Nov 2026, #gsa): 1. Chat, 2. Job board, 3. Pricing; ask-logic.mjs chatTabs. The two
     prepared ones are the demo's own locked frames (#prepared), behind the same access code */
  #ctabs { display:none; }
  body.chat #ctabs:not([hidden]) { display:flex; gap:10px; width:100%; max-width:1040px; margin:0 auto; padding:16px 32px 0; }
  body.chat #ctabs button { color:var(--ink); padding:9px 20px; font-size:17px; font-weight:400; background:var(--panel); border:1px solid var(--line); border-radius:999px; }
  body.chat #ctabs button.on { color:var(--onaccent); background:var(--accent); border-color:var(--accent); font-weight:700; }
  body.chat #prepared:not([hidden]) { width:100%; max-width:1280px; margin:0 auto; padding:12px 32px 24px; }
  @media (max-width: 760px) { body.chat #ctabs, body.chat #prepared:not([hidden]) { padding-left:16px; padding-right:16px; } }
  /* a result in the chat (Oren + Elad, 5 Nov 2026, #gsa): one title line, the quote clamped to three lines, the source
     link; ask-logic.mjs flatCard, QUOTE_LINES */
  .card.flat { padding:14px 20px 16px; }
  .card.flat h3 { margin:0 0 8px; font-size:17px; font-weight:700; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card.flat blockquote { font-size:16px; padding:8px 14px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; line-clamp:3; overflow:hidden; }
  .card.flat a.link, .card.flat .where { margin-top:8px; font-size:15px; }
  .card.flat .where { color:var(--muted); }
  body.chat #chatbar { display:flex; flex-wrap:wrap; gap:10px; width:100%; max-width:1040px; margin:0 auto; padding:16px 32px 0; }
  body.chat #chatbar button { color:var(--ink); padding:8px 16px; font-size:15px; background:var(--panel); border:1px solid var(--line); border-radius:999px; }
  body.chat #chatbar #newchat { border-color:var(--accent); }
  body.chat #chatlist { display:flex; flex-direction:column; gap:6px; width:100%; max-width:1040px; margin:10px auto 0; padding:0 32px; }
  body.chat #chatlist button { color:var(--ink); text-align:left; padding:10px 14px; font-size:15px; font-weight:400; background:var(--panel); border:1px solid #e3e0d8; border-radius:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  body.chat main#list { padding-bottom:24px; }
  body.chat .ans { margin-top:26px; }
  body.chat .echo { justify-content:flex-end; margin:0 0 14px; }
  body.chat .echo b { display:none; }
  body.chat .echo span { max-width:80%; padding:10px 16px; font-size:17px; color:var(--ink); background:var(--tint); border-radius:18px 18px 4px 18px; }
  body.chat .ans h2 { font-size:30px; } body.chat .lead { font-size:19px; margin:10px 0 18px; }
  body.chat .card .place, body.chat .card .key { font-size:18px; }
  body.chat .empty { margin-top:8vh; font-size:19px; }
  .und { display:flex; gap:10px; align-items:baseline; margin:0 0 10px; font-size:15px; color:#4a4943; unicode-bidi:plaintext; }
  .und b { flex:none; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  body.chat form#ask { position:sticky; bottom:0; z-index:4; padding:14px max(32px, calc((100% - 976px) / 2)) 18px; background:var(--bg); border-top:1px solid var(--line); max-width:none; }
  body.chat form#ask input { font-size:18px; padding:13px 16px; }
  body.chat form#ask button { font-size:17px; padding:0 24px; }
  @media (max-width: 760px) {
    body.chat form#ask { flex-direction:row; padding:10px 12px 12px; } body.chat form#ask button { padding:0 16px; }
    body.chat #chatbar, body.chat #chatlist { padding-left:16px; padding-right:16px; }
    body.chat .echo span { max-width:90%; } body.chat .ans h2 { font-size:26px; }
  }
  @media (max-width: 760px) {
    body.side { flex-direction:column; }
    body.side aside { width:auto; height:auto; position:static; border-right:0; border-bottom:1px solid var(--line); }
    body.side nav#tabs .g { flex-direction:row; flex-wrap:wrap; }
    body.side #scope { margin-left:0; max-width:none; }
    main, form#ask { padding-left:16px; padding-right:16px; }
    .ans h2 { font-size:36px; } .lead { font-size:20px; }
    .card .l1 { flex-direction:column; gap:4px; } .card .key { text-align:left; }
    form#ask { flex-direction:column; } form#ask button { padding:12px; }
    .card .top { padding:14px 16px; } .card .body { margin:0 16px; } .card .l2 { flex-wrap:wrap; gap:8px; } .tag { flex:0 1 auto; }
  }
</style>
</head>
<body>
<aside>
<header><img id="logo" alt=""><h1 id="title">Ask your project files</h1></header>
<nav id="tabs" hidden></nav>
</aside>
<div id="col">
<div id="topbar"><button id="fold" type="button" aria-label="Show or hide the menu" title="Show or hide the menu">☰</button><b id="cur"></b><span class="muted" id="curg"></span><button id="next" type="button" hidden>Next step →</button><button id="present" type="button" hidden title="One step at a time, like slides: Next → or the → key; Enter asks">▶ Presenter mode</button><button id="scope" type="button" hidden></button><button id="signout" type="button" hidden>Sign out</button></div>
<nav id="ctabs" hidden></nav>
<section id="prepared" hidden>
<form id="gate"><p>Access code for the prepared answers</p><input id="code" type="password" autocomplete="off"><button type="submit">Open</button><div class="err" id="gerr"></div></form>
</section>
<section id="live">
<form id="ask" hidden><input id="q" autocomplete="off" maxlength="500" dir="auto" aria-label="Your question"><button id="go" type="submit">Ask</button></form>
<section id="signin" hidden><h2>Chat with your project files</h2><p>Sign in with the email and password you were given.</p>
<form id="pwform"><input id="email" type="email" autocomplete="username" placeholder="Email" aria-label="Email" required><input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required><button id="pwgo" type="submit">Sign in</button></form>
<p id="signmsg" role="status"></p><p class="or"><button id="google" type="button" class="staff">Cleopatra staff: sign in with Google</button></p></section>
<div id="chatbar"><button id="newchat" type="button" hidden>+ New conversation</button><button id="chats" type="button" hidden></button><button id="gfbgo" type="button" hidden>✎ Send feedback</button></div>
<div id="chatlist" hidden></div>
<div id="msg" role="status"></div>
<main id="list" aria-live="polite"></main>
</section>
</div>
<div id="pres" aria-live="polite"><div class="phead"><img id="plogo" alt=""><span id="pcount"></span><button id="pexit" type="button">Exit presenter mode</button></div>
<div id="pmain"><h2 id="ptitle"></h2><div id="pbody"></div>
<form id="pask" hidden><textarea id="pq" maxlength="500" dir="auto" aria-label="Your question"></textarea><button id="pgo" type="submit">Ask</button></form>
<div id="pans"></div></div>
<button id="pnext" type="button" hidden>Next →</button></div>
<button id="fbgo" type="button" hidden title="Right-click any part of the page, or tap here and then the part (on a prepared answer, use this button)">✎ Feedback</button>
<dialog id="fb"><form id="fbform"><p id="fbon"></p><textarea id="fbnote" maxlength="2000" dir="auto" placeholder="What should change here?"></textarea>
<div class="err" id="fberr"></div><div class="row"><button id="fbcancel" type="button">Cancel</button><button id="fbsend" type="submit">Send</button></div></form></dialog>
<dialog id="inv"><h2>What's in this demo</h2><p class="sub" id="invsub"></p>
<div class="row"><input id="invq" autocomplete="off" placeholder="Search jobs, addresses, councils, document types" aria-label="Search the jobs"><span id="invn"></span><button id="invclose" type="button">Close</button></div>
<div class="wrap" id="invt"></div></dialog>
<script type="module" src="ask.js"></script>
</body>
</html>
