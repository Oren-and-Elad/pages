document.getElementById('a').innerHTML=D.bodies[k];document.querySelectorAll('.presets a').forEach(a=>a.classList.toggle('on',a.dataset.k===k));scrollTo(0,0);if(k==='J1')jb()}
const JBS=['Pre-DA','DA','Court','Completed','No stage'],JBC={'Pre-DA':'pre','DA':'da','Court':'court','Completed':'done','No stage':'none'},JBK='gsaJobBoard';
function jbLoad(){try{return JSON.parse(localStorage.getItem(JBK))||{}}catch(e){return{}}}
function jb(){const a=document.getElementById('a'),kan=a.querySelector('.kanban');if(!kan)return;
const team=[...a.querySelectorAll('.team .who')].map(w=>({w,i:w.querySelector('.ini').textContent,n:w.querySelector('b').textContent,un:w.querySelector('.ini.un')}));
const ppl=team.filter(t=>!t.un),cards=[];
kan.querySelectorAll('section.stage').forEach(sec=>{const st=sec.querySelector('.chip').textContent;
 sec.querySelectorAll('details.job').forEach(c=>{const m=c.querySelector('.jm').textContent.match(/Job (\S+)/);const ini=c.querySelector('.jt .ini');
  cards.push({c,id:m?m[1]:String(cards.length),s:st,p:ini.classList.contains('un')?'':ini.textContent})})});
const saved=jbLoad();kan.innerHTML='';const secs={};
JBS.forEach(s=>{const sec=document.createElement('section');sec.className='stage';
 sec.innerHTML='<h3><span class="chip '+JBC[s]+'"></span><span class="n"></span></h3>';sec.querySelector('.chip').textContent=s;kan.appendChild(sec);secs[s]=sec});
function opt(sel,v,t){const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o)}
function paint(){const st=jbLoad();
 cards.forEach(x=>{const v=st[x.id]||{};x.ns=JBS.includes(v.s)?v.s:x.s;x.np=v.p!==undefined?v.p:x.p});
 JBS.forEach(s=>{const l=cards.filter(x=>x.ns===s).sort((p,q)=>(p.np==='')-(q.np==='')||(p.id>q.id?1:-1));l.forEach(x=>secs[s].appendChild(x.c));secs[s].querySelector('.n').textContent=l.length});
 cards.forEach(x=>{const ini=x.c.querySelector('.jt .ini'),who=ppl.find(t=>t.i===x.np);
  ini.className=who?'ini':'ini un';ini.textContent=who?who.i:'?';ini.title=who?who.n:'Unassigned';
  x.c.querySelector('.jm').textContent='Job '+x.id+' · '+(who?who.n:'Unassigned');x.ps.value=who?who.i:'';x.ss.value=x.ns});
 team.forEach(t=>{const l=cards.filter(x=>t.un?!ppl.some(p=>p.i===x.np):x.np===t.i),sm=t.w.querySelector('small');
  sm.textContent=t.un?sm.textContent.replace(/^\d+/,String(l.length)):sm.textContent.replace(/\d+ open · \d+ done/,l.filter(x=>x.ns!=='Completed').length+' open · '+l.filter(x=>x.ns==='Completed').length+' done')})}
cards.forEach(x=>{const bar=document.createElement('div');bar.className='jbe';
 bar.style.cssText='display:flex;gap:6px;flex-wrap:wrap;padding:0 0 8px;font-size:13px';
 const ps=document.createElement('select'),ss=document.createElement('select');ps.setAttribute('aria-label','Planner');ss.setAttribute('aria-label','Stage');
 opt(ps,'','Unassigned');ppl.forEach(t=>opt(ps,t.i,t.i+' · '+t.n));JBS.forEach(s=>opt(ss,s,s));
 [ps,ss].forEach(el=>{el.style.cssText='font:inherit;padding:4px 6px;max-width:100%';bar.appendChild(el)});
 const save=()=>{const st=jbLoad();st[x.id]={s:ss.value,p:ps.value};localStorage.setItem(JBK,JSON.stringify(st));x.c.open=true;paint()};
 ps.onchange=save;ss.onchange=save;x.ps=ps;x.ss=ss;const jd=x.c.querySelector('.jd');jd.insertBefore(bar,jd.firstChild)});
const r=document.createElement('a');r.href='#J1';r.textContent='Reset demo';r.style.cssText='display:inline-block;margin:0 0 12px;font-size:13px';
r.onclick=e=>{e.preventDefault();localStorage.removeItem(JBK);show()};const ans=a.querySelector('.ans');ans.parentNode.insertBefore(r,ans.nextSibling);
paint()}
async function open(code){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.salt),iterations:B.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  D=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.iv)},key,b64(B.ct))));
  document.getElementById('s').textContent=D.css;document.body.innerHTML=D.body;sessionStorage.setItem('c',code);
  addEventListener('hashchange',show);show();
}
document.getElementById('gate').onsubmit=e=>{e.preventDefault();document.getElementById('err').textContent='Opening…';
  open(document.getElementById('code').value.trim()).catch(()=>{document.getElementById('err').textContent='Wrong code.'})};
const c0=sessionStorage.getItem('c');if(c0)open(c0).catch(()=>sessionStorage.removeItem('c'));
</script></body></html>
