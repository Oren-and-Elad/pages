const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(code){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.salt),iterations:B.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const D=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.iv)},key,b64(B.ct))));
  document.getElementById('s').textContent=D.css;document.body.innerHTML=D.body;sessionStorage.setItem('c',code);
  const S=[...document.querySelectorAll('section')];let i=Math.min(S.length-1,Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
function go(n){i=Math.max(0,Math.min(S.length-1,n));S.forEach((s,k)=>s.classList.toggle('on',k===i));document.getElementById('n').textContent=(i+1)+' / '+S.length;
document.getElementById('bk').disabled=i===0;document.getElementById('nx').disabled=i===S.length-1;document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';history.replaceState(null,'','#'+(i+1))}
function fit(){const st=document.getElementById('stage');st.style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1280,innerHeight/720)+')'}
addEventListener('resize',fit);addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(i+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(i-1)}});
document.getElementById('nx').onclick=()=>go(i+1);document.getElementById('bk').onclick=()=>go(i-1);fit();go(i);
}
document.getElementById('gate').onsubmit=e=>{e.preventDefault();document.getElementById('err').textContent='Opening…';
  open(document.getElementById('code').value.trim()).catch(()=>{document.getElementById('err').textContent='Wrong code.'})};
const saved=sessionStorage.getItem('c');if(saved)open(saved).catch(()=>sessionStorage.removeItem('c'));
