let D=null;
function show(){const k=(location.hash.slice(1)||'').toUpperCase();document.body.innerHTML=D.bodies[k]||D.bodies[Object.keys(D.bodies)[0]].replace(/<div class="q">[\s\S]*$/,'</div></main>');window.scrollTo(0,0)}
async function open(code){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.salt),iterations:B.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  D=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.iv)},key,b64(B.ct))));
  document.getElementById('s').textContent=D.css;sessionStorage.setItem('c',code);addEventListener('hashchange',show);show();
}
document.getElementById('gate').onsubmit=e=>{e.preventDefault();document.getElementById('err').textContent='Opening…';
  open(document.getElementById('code').value.trim()).catch(()=>{document.getElementById('err').textContent='Wrong code.'})};
